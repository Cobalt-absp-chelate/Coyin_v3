<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知页 Writer</title>
<link rel="stylesheet" href="/vendor/vditor/dist/index.css" />
<link rel="stylesheet" href="/vendor/writer/writer.css" />
</head>
<body>
<div class="writer-container">
  <header class="writer-toolbar">
    <div class="writer-toolbar-left">
      <button class="glass-btn" onclick="window.location.href='/'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>返回</span>
      </button>
    </div>
    <span class="writer-title">知页 Writer</span>
    <div class="writer-toolbar-right">
      <span class="writer-save-status" id="save-status">已保存</span>
      <div class="export-wrap" id="export-wrap">
        <button class="glass-btn" id="export-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>导出</span>
        </button>
        <div class="glass-menu" id="export-menu">
          <button class="glass-menu-item" id="export-md-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>导出为 Markdown</span>
          </button>
          <button class="glass-menu-item" id="export-pdf-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>导出为 PDF（打印）</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="fallback-banner" class="fallback-banner">
    编辑器加载失败，已切换到纯文本模式。内容仍然会自动保存。
  </div>

  <div id="vditor-container" style="flex:1;min-height:0;"></div>

  <textarea
    id="fallback-textarea"
    class="fallback-textarea"
    placeholder="开始写作..."
    spellcheck="false"
  ></textarea>
</div>

<!-- Context menu (right-click) -->
<div class="ctx-menu" id="ctx-menu">
  <button class="ctx-menu-item" data-action="translate">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l6 6M7 8l-2 4M13 8l-2 4M21 12c0 5-4 9-9 9s-9-4-9-9 4-9 9-9 9 4 9 9z"/></svg>
    <span>翻译选中内容</span>
  </button>
  <button class="ctx-menu-item" data-action="polish">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/></svg>
    <span>润色这段文字</span>
  </button>
  <button class="ctx-menu-item" data-action="continue">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    <span>续写</span>
  </button>
  <button class="ctx-menu-item" data-action="copy-sel">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
    <span>复制</span>
  </button>
</div>

<!-- AI result card -->
<div class="ai-card" id="ai-card">
  <button class="ai-card-close" id="ai-card-close">&times;</button>
  <div class="ai-card-title" id="ai-card-title"></div>
  <div class="ai-card-body" id="ai-card-body"></div>
  <div class="ai-card-actions" id="ai-card-actions"></div>
</div>

<!-- Toast -->
<div class="writer-toast" id="writer-toast"></div>

<script src="/vendor/vditor/dist/index.min.js"></script>
<script src="/vendor/writer/writer.js"></script>
</body>
</html>
